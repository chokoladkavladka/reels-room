services:
  - type: web
    name: reels-room
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR
        value: apify~instagram-reel-scraper
